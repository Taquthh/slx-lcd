[package]
name = "sensors"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Linux system sensors (CPU, RAM, disk, network, fans, GPU) read from /proc and /sys"

[dependencies]
serde = { version = "1", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
serde_json = "1"
