<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLX LCD</title>
<style>
  :root {
    --bg: #0a111c; --panel: #111b2b; --line: #1f2f47; --text: #e6f1fa; --muted: #7f9db3;
    --accent: #2ee6c5; --warn: #ff9f43; --bad: #ff6b6b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Inter", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  main { display: grid; grid-template-columns: 500px 1fr; gap: 20px; padding: 20px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  #preview { width: 100%; max-width: 480px; aspect-ratio: 1; border-radius: 50%/50%; background: #000; display: block; margin: 0 auto; border: 1px solid var(--line); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  label { color: var(--muted); }
  select, input, button, textarea { font: inherit; color: var(--text); background: #0c1626; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  button { cursor: pointer; background: #14233a; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #04211c; border-color: var(--accent); font-weight: 600; }
  button.danger { border-color: var(--bad); color: var(--bad); }
  textarea { width: 100%; min-height: 360px; font: 12.5px/1.5 ui-monospace, "DejaVu Sans Mono", monospace; resize: vertical; tab-size: 2; }
  #msg { min-height: 1.4em; margin-top: 8px; }
  #msg.err { color: var(--bad); } #msg.ok { color: var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .stat { background: #0c1626; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 18px; } .stat span { color: var(--muted); font-size: 12px; }
  .ports { color: var(--muted); font: 12px ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <h1>SLX LCD · ID-Cooling SL360 XE</h1>
  <span id="state" style="color:var(--muted)">daemon berhenti</span>
</header>
<main>
  <div>
    <section>
      <h2>Pratinjau langsung</h2>
      <img id="preview" alt="Pratinjau layar 480x480">
      <div class="row">
        <label for="theme">Tema</label>
        <select id="theme"></select>
        <button id="btn-reload">Muat</button>
      </div>
      <div class="row">
        <label for="brightness">Kecerahan</label>
        <input id="brightness" type="range" min="0" max="100" value="60">
        <span id="brightness-val">60</span>
        <label for="orientation">Orientasi</label>
        <select id="orientation">
          <option value="landscape">Landscape</option>
          <option value="portrait">Portrait</option>
          <option value="rlandscape">Landscape terbalik</option>
          <option value="rportrait">Portrait terbalik</option>
        </select>
      </div>
      <div class="row">
        <button id="btn-start" class="primary">Kirim ke layar</button>
        <button id="btn-stop" class="danger">Hentikan</button>
      </div>
    </section>
    <section style="margin-top:20px">
      <h2>Sensor</h2>
      <div class="stats" id="stats"></div>
      <h2 style="margin-top:14px">Port serial</h2>
      <div class="ports" id="ports">…</div>
    </section>
  </div>
  <section>
    <h2>Editor tema (JSON)</h2>
    <textarea id="editor" spellcheck="false"></textarea>
    <div class="row">
      <input id="save-name" placeholder="nama-tema" size="18">
      <button id="btn-save">Simpan</button>
      <span style="color:var(--muted)">Pratinjau diperbarui otomatis saat Anda mengetik.</span>
    </div>
    <div id="msg"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
