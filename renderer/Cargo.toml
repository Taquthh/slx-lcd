[package]
name = "renderer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Theme renderer: JSON theme + sensor snapshot -> 480x480 RGBA frame"

[dependencies]
sensors = { path = "../sensors" }
lcd-core = { path = "../lcd-core" }
tiny-skia = "0.12"
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
thiserror = "1"
